
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six Frames</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 5px;
    background: #111;
}
.frames {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
}
iframe {
    width: 100%;
    height: 48vh;
    border: 1px solid #555;
    background: white;
}
.bottom iframe {
    height: 48vh;
}
</style>
</head>
<body>

<div class="frames">
    <iframe src="https://lltrco.com/?r=mahmoudyoussef20"></iframe>
    <iframe src="https://lltrco.com/?r=mahmoudyoussef2024"></iframe>
    <iframe src="https://lltrco.com/?r=mmyy11"></iframe>
    <iframe src="https://lltrco.com/?r=mmyy1"></iframe>
</div>

<div class="frames bottom">
    <iframe src="https://lltrco.com/?r=mmyy2"></iframe>
    <iframe src="https://lltrco.com/?r=mmyy4"></iframe>
</div>

</body>
</html>
