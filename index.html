<style>
  :root {
    --bg:#0f1319; --bar:#171c24; --line:#262d38; --text:#e8ecf2; --muted:#8b95a5; --accent:#4f8cff;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif; overflow:hidden; }

  .page { display:flex; flex-direction:column; width:100%; height:100%; }

  /* الشريط العلوي */
  .bar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 14px; padding-top:max(8px, env(safe-area-inset-top, 0px));
    background:var(--bar); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .open { color:var(--muted); font-size:13px; text-decoration:none; padding:5px 10px;
    border:1px solid var(--line); border-radius:8px; transition:.15s; white-space:nowrap; }
  .open:hover { color:var(--text); border-color:var(--accent); }

  /* مكان بانر إعلاني (مخفي لحد ما تضيف الكود) */
  .ad { display:none; flex:0 0 auto; text-align:center; background:var(--bar);
    border-bottom:1px solid var(--line); padding:4px; max-height:110px; overflow:hidden; }

  /* منطقة الفريم */
  .frame { position:relative; flex:1 1 auto; min-height:0; margin:8px;
    margin-bottom:max(8px, env(safe-area-inset-bottom, 0px));
    border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;
    box-shadow:0 4px 24px rgba(0,0,0,.35); }
  .frame iframe { display:block; width:100%; height:100%; border:0; background:#fff; }

  .loader { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:14px; transition:opacity .3s; }
  .loader.hide { opacity:0; pointer-events:none; }

  @media (max-width:600px) {
    .frame { margin:4px; border-radius:8px; }
    .bar { padding:6px 10px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="bar">
    <div class="brand"><span class="dot"></span> صفحتي</div>
    <a class="open" href="https://lltrco.com/?r=mahmoudyoussef20" target="_blank" rel="noopener">فتح في صفحة جديدة ↗</a>
  </header>

  <div class="ad">
    <!-- الصق هنا كود بانر (مثل A-ADS) ثم امسح display:none من .ad -->
  </div>

  <main class="frame">
    <div class="loader" id="loader">جارٍ التحميل...</div>
    <iframe src="https://lltrco.com/?r=mahmoudyoussef20" title="الصفحة" allow="fullscreen"
            referrerpolicy="no-referrer-when-downgrade"
            onload="document.getElementById('loader').classList.add('hide')"></iframe>
  </main>

</div>

</body>
</html>
