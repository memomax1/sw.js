
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memo Max - 8 Frames</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
}

body {
  background: #111;
  padding: 8px;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

iframe {
  width: 100%;
  height: 100vh;
  border: 0;
  background: #111;
}

@media(max-width:600px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <iframe src="https://memomax1.github.io/memo/"></iframe>

  <iframe src="https://memomax2.github.io/memo/"></iframe>

</div>

</body>
</html>
