<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفريمات</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { padding: 8px; background: #111; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    iframe {
      width: 100%;
      height: 50vh;
      border: 0;
      border-radius: 8px;
      background: #fff;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="grid">
    <iframe data-src="https://lltrco.com/?r=mahmoudyoussef20"></iframe>
    <iframe data-src="https://lltrco.com/?r=mahmoudyoussef2024"></iframe>
    <iframe data-src="https://lltrco.com/?r=mmyy1"></iframe>
    <iframe data-src="https://lltrco.com/?r=mmyy11"></iframe>
  </div>

  <script>
    setTimeout(function () {
      document.querySelectorAll('iframe[data-src]').forEach(function (f) {
        f.src = f.dataset.src;
      });
    }, 3000);
  </script>

</body>
</html>
