
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Traffic Hub</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080e1c;
    font-family: Arial, sans-serif;
}

.header {
    background: linear-gradient(120deg,#101d35,#142c4d);
    padding: 14px 12px;
    text-align: center;
    border-bottom: 2px solid #2676c9;
}

.header h1 {
    color: white;
    font-size: 22px;
    margin: 0;
}

.header p {
    color: #a9c5e5;
    font-size: 12px;
    margin: 6px 0 0;
}

.frame {
    width: 100%;
    height: 70vh;
    min-height: 450px;
    margin-bottom: 8px;
    overflow: hidden;
    background: white;
}

.frame iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
}

.footer {
    padding: 15px;
    text-align: center;
    color: #8298b5;
    font-size: 11px;
}

/* Curtains */
.curtain-l, .curtain-r {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 50%;
    background: #5a1230;
    z-index: 9998;
    transition: transform 1.2s ease;
}

.curtain-l { left: 0; }
.curtain-r { right: 0; }

.curtain-l::after, .curtain-r::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        90deg,
        transparent 0 22px,
        #4a0e27 22px 26px
    );
}

.curtain-open .curtain-l {
    transform: translateX(-100%);
}

.curtain-open .curtain-r {
    transform: translateX(100%);
}

/* Riddle Box */
.riddle-box {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 9999;
    transform: translate(-50%, -50%);
    width: min(88%, 380px);
    padding: 22px 18px;
    background: #1b0f3a;
    border: 2px dashed #b48cff;
    border-radius: 15px;
    color: #e8dcff;
    text-align: center;
    box-shadow: 0 10px 50px #0008;
    transition: opacity .4s;
}

.riddle-box h3 {
    margin: 0 0 12px;
    font-size: 19px;
    color: #b48cff;
}

.riddle-box p {
    margin: 0 0 16px;
    font-size: 18px;
    line-height: 1.8;
}

.riddle-box input {
    padding: 11px;
    width: 65%;
    text-align: center;
    border-radius: 7px;
    border: 1px solid #7b4dff;
    background: #2b1a5e;
    color: #fff;
    font-size: 16px;
    outline: none;
}

.riddle-box button {
    padding: 11px 15px;
    border: 0;
    border-radius: 7px;
    background: #7b4dff;
    color: #fff;
    cursor: pointer;
    font-size: 15px;
}

.riddle-err {
    display: block;
    min-height: 22px;
    margin-top: 10px;
    font-size: 13px;
    color: #ff9a9a;
}

.curtain-open .riddle-box {
    opacity: 0;
    pointer-events: none;
}

.curtain-open .curtain-l,
.curtain-open .curtain-r {
    pointer-events: none;
}
</style>
</head>

<body>

<div class="header">
    <h1>DIGITAL TRAFFIC HUB</h1>
    <p>Your Online Traffic Experience</p>
</div>

<!-- First Frame -->
<div class="frame">
    <iframe
        src="https://lltrco.com/?r=mahmoudyoussef20"
        loading="eager"
        title="Traffic Frame 1">
    </iframe>
</div>

<!-- Second Frame -->
<div class="frame">
    <iframe
        src="https://lltrco.com/?r=mahmoudyoussef2024"
        loading="eager"
        title="Traffic Frame 2">
    </iframe>
</div>

<div class="footer">
    Digital Traffic Hub
</div>

<!-- Curtains -->
<div class="curtain-l"></div>
<div class="curtain-r"></div>

<!-- Riddle Box -->
<div class="riddle-box" id="riddleBox">
    <h3>🔐 Solve the Riddle</h3>

    <p>
        What gets bigger the more you take away from it?
    </p>

    <input
        type="text"
        id="answer"
        placeholder="Type your answer"
        autocomplete="off">

    <button onclick="checkAnswer()">Open the Curtains</button>

    <span class="riddle-err" id="error"></span>
</div>

<script>
function checkAnswer() {
    const answer = document.getElementById("answer")
        .value.trim().toLowerCase();

    const error = document.getElementById("error");

    if (answer === "a hole" || answer === "hole") {
        document.body.classList.add("curtain-open");
        error.textContent = "";
    } else {
        error.textContent = "Incorrect answer! Try again.";
    }
}

document.getElementById("answer").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkAnswer();
});
</script>

</body>
</html>
