  :root {

  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif; overflow:hidden; }

  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { flex:0 0 auto; width:30px; height:30px; border-radius:9px;

  .btn { font-size:13px; font-weight:600; text-decoration:none; padding:7px 14px; border-radius:9px;

  .btn:hover { color:var(--text); border-color:var(--accent); }
  .btn.primary { color:#fff; border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .btn.primary:hover { filter:brightness(1.1); }
  .btn.offer { color:#ffd166; border-color:rgba(255,209,102,.45); }
  .btn.offer:hover { color:#ffe29a; border-color:#ffd166; }

  /* Optional banner slot (hidden until you add a code and remove display:none) */
  .ad { display:none; flex:0 0 auto; text-align:center; background:var(--panel);
    border-bottom:1px solid var(--line); padding:4px; max-height:110px; overflow:hidden; }

  /* Frame area */
  .frame { position:relative; flex:1 1 auto; min-height:0; margin:8px;

  .loader { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

  .loader.hide { opacity:0; pointer-events:none; }
